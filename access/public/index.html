<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · ForgeView</title>
  <link rel="icon" href="/forgeview.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/access.css">
  <link rel="stylesheet" href="/guest.css">
  <script type="module" src="/access.js"></script>
</head>
<body>
  <main class="entry">
    <section class="panel" aria-labelledby="title">
      <div class="brand">
        <img src="/forgeview.svg" width="48" height="48" alt="">
        <div><div class="brand-title">ForgeView</div><div class="brand-company">GRITFORGE</div></div>
      </div>
      <h1 id="title">Sign in to ForgeView</h1>
      <p id="intro">Enter your ForgeView access code.</p>
      <form id="sign-in">
        <div id="code-field">
          <label for="code">Access code</label>
          <div class="field">
            <input id="code" type="password" required maxlength="48" autocomplete="current-password"
              autocapitalize="none" spellcheck="false" aria-describedby="sign-in-status">
            <button id="show-code" class="visibility" type="button" aria-label="Show access code" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>
        <button id="open" class="primary" type="submit">Sign in</button>
        <p id="sign-in-status" class="status" role="status"></p>
      </form>
      <a id="continue" class="primary return" href="/manage/" hidden>Open guest access</a>
    </section>
  </main>
</body>
</html>
