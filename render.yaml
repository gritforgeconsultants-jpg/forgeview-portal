services:
  - type: web
    name: gritforge-forgeview-guests
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start:guest
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        fromDatabase:
          name: forgeview-guest-access
          property: connectionString
      - key: FORGEVIEW_OWNER_SHA256
        sync: false
      - key: FORGEVIEW_BUNDLE_KEY
        sync: false
databases:
  - name: forgeview-guest-access
    plan: free
    region: oregon
    ipAllowList: []
