services:
  - type: web
    name: gritforge-forgeview-guests
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start:guest
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        fromDatabase:
          name: forgeview-guest-access
          property: connectionString
      - key: FORGEVIEW_SETUP_SHA256
        value: beffc9fe1cae2e11c87588846bc5b965ee4de5cb93e7a8110785be9157fc1730
      - key: FORGEVIEW_SETUP_SEAL
        generateValue: true
databases:
  - name: forgeview-guest-access
    plan: free
    region: oregon
    ipAllowList: []
